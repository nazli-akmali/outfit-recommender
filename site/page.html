<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{short_title}} · {{eyebrow}}</title>
  <meta name="theme-color" content="#F5F2EC" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1A1A1C" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="{{root}}site.css">
</head>
<body>
  <!-- Generated by site/build.py from Markdown. Edit the source file, not this output. -->
  <header class="topbar">
    <div class="wrap">
      <a class="brand" href="{{portfolio}}">{{author}} <span>/ {{site_title}}</span></a>
      <nav class="topnav" aria-label="Project">
        <a href="{{root}}">Overview</a>
        <a href="{{root}}app/">Demo</a>
        <a class="hide-sm" href="{{repo}}">Code</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="doc-head">
      <div class="wrap">
        <p class="eyebrow">{{eyebrow}}</p>
        <h1>{{short_title}}</h1>
      </div>
    </div>
    <div class="wrap doc-layout">
      <nav class="toc" aria-label="On this page">
        <p>On this page</p>
        <ol>{{toc}}</ol>
      </nav>
      <article class="prose">
        {{content}}
        <div class="doc-foot">
          <a class="btn primary" href="{{root}}app/">Try the live demo</a>
          <a class="btn" href="{{root}}">Project overview</a>
        </div>
      </article>
    </div>
  </main>

  <footer class="footer">
    <div class="wrap">
      <span><a href="{{source_url}}">View this page's source on GitHub</a></span>
      <span><a href="{{repo}}">Code</a> · <a href="{{portfolio}}">Portfolio</a></span>
    </div>
  </footer>

  <script>
    const bar = document.querySelector('.topbar');
    const onScroll = () => bar.classList.toggle('scrolled', scrollY > 8);
    addEventListener('scroll', onScroll, { passive: true }); onScroll();
    // Highlight the section currently in view in the side navigation.
    const links = [...document.querySelectorAll('.toc a')];
    const byId = new Map(links.map((a) => [decodeURIComponent(a.hash.slice(1)), a]));
    const io = new IntersectionObserver((entries) => {
      for (const e of entries) if (e.isIntersecting) {
        links.forEach((a) => a.classList.remove('on'));
        byId.get(e.target.id)?.classList.add('on');
      }
    }, { rootMargin: '-80px 0px -70% 0px' });
    document.querySelectorAll('.prose h2[id]').forEach((h) => io.observe(h));
  </script>
</body>
</html>
